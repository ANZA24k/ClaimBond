name: Contract verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: genvm-lint check contracts/claimbond.py
      - run: genvm-lint validate contracts/claimbond.py
      - run: genvm-lint typecheck contracts/claimbond.py
      - run: genvm-lint schema contracts/claimbond.py --output /tmp/abi.json
      - run: pytest tests/direct -q
      - run: pytest tests/integration -q
